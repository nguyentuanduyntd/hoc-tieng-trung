<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Áp giao diện & cỡ chữ Hán trước khi vẽ trang (tránh nháy màu). Lỗi storage -> mặc định.
      (function () {
        var d = document.documentElement, s = {};
        try { s = JSON.parse(localStorage.getItem("htt.settings.v1") || "{}") || {}; } catch (e) {}
        var scale = { normal: 1, large: 1.2, xlarge: 1.45 };
        d.dataset.theme = s.theme === "light" ? "light" : "dark";
        d.dataset.zh = scale[s.zhSize] ? s.zhSize : "normal";
        d.style.setProperty("--zh-scale", String(scale[d.dataset.zh]));
      })();
    </script>
    <title>Học Tiếng Trung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
